<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.title }} — {{ brand }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://releases.transloadit.com/uppy/v3.24.3/uppy.min.css" rel="stylesheet">
</head>
<body>
  <div class="page">
    <div class="brand-header">
      <img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="{{ brand }}">
      <h1>{{ event.title }}</h1>
      {% if event.description %}<p>{{ event.description }}</p>{% endif %}
    </div>

    <div class="panel">
      <div id="upload-container"></div>

      <div id="confirmation" class="confirmation">
        <div class="check">&#10003;</div>
        <p id="confirmation-text"></p>
      </div>
    </div>

    <div class="footer-note">
      Accepted file types: {{ event.allowed_ext | join(', ') }} &middot;
      Max size: {{ event.max_file_size_mb }} MB
    </div>
  </div>

  <script src="https://releases.transloadit.com/uppy/v3.24.3/uppy.min.js"></script>
  <script>
    const cfg = {{ client_config_json | safe }};

    const uppy = new Uppy.Uppy({
      restrictions: {
        allowedFileTypes: cfg.allowedExt,
        maxFileSize: cfg.maxFileSizeMB * 1024 * 1024,
      },
      autoProceed: false,
    })
    .use(Uppy.Dashboard, {
      inline: true,
      target: '#upload-container',
      height: 420,
      showProgressDetails: true,
      proudlyDisplayPoweredByUppy: false,
      note: `Accepted: ${cfg.allowedExt.join(', ')} — up to ${cfg.maxFileSizeMB} MB each`,
    })
    .use(Uppy.Tus, {
      endpoint: '/files/',
      chunkSize: 50 * 1024 * 1024,
      retryDelays: [0, 1000, 3000, 5000],
    });

    uppy.on('file-added', (file) => {
      uppy.setFileMeta(file.id, { eventSlug: cfg.eventSlug, filename: file.name });
    });

    uppy.on('complete', (result) => {
      if (result.successful.length > 0) {
        document.getElementById('upload-container').style.display = 'none';
        document.getElementById('confirmation-text').textContent = cfg.confirmationMessage;
        document.getElementById('confirmation').style.display = 'block';
      }
    });
  </script>
</body>
</html>
