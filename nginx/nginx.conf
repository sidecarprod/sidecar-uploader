server {
    listen 80;
    server_name submit.sidecarprod.com;

    client_max_body_size 0;

    # tus protocol endpoint - resumable upload transport
    location /files {
        proxy_pass http://uploader-tusd:1080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # everything else (event pages, admin) - flask
    location / {
        proxy_pass http://uploader-web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
